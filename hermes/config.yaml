# Sovereign CTO Stack — Hermes orchestrator config (tracked reference copy).
#
# This is the version-controlled record of the orchestrator profile's config.
# Hermes itself reads ~/.hermes/config.yaml (or $HERMES_HOME/config.yaml). On a
# clean clone, copy the relevant keys into ~/.hermes/config.yaml, OR run the
# documented setup commands (see docs/setup-guide.md Phase 1) which write them.
# Secrets live ONLY in ~/.hermes/.env — never in this file (gitleaks-enforced).

# --- Inference: Nous Portal (OAuth) ---
# `hermes portal login` (== `hermes setup --portal`) performs the device-code
# OAuth flow and stores a refresh token at ~/.hermes/auth.json, exposing a local
# OpenAI-compatible proxy at http://127.0.0.1:8645/v1. The static NOUS_PORTAL_API_KEY
# in .env is the alternative direct inference credential.
provider: nous
model: Hermes-4-405B

# --- Memory: mem0 (self-hosted OSS on pgvector; Platform fallback via MEM0_API_KEY) ---
# Behavioral config for the mem0 provider lives in hermes/mem0.json (mode: oss).
# The pgvector backend is the docker-compose `mem0-postgres` service.
memory:
  provider: mem0

# --- Messaging gateway: Telegram ---
# Token + allowed users come from ~/.hermes/.env (TELEGRAM_BOT_TOKEN,
# TELEGRAM_ALLOWED_USERS, TELEGRAM_HOME_CHANNEL). Configured via `hermes gateway setup`.
gateway:
  telegram:
    enabled: true

# --- MCP servers ---
# cto_knowledge (Phase 2) is the textbook RAG brain — the local Vector MCP sidecar
# (docker-compose `rag-sidecar`). It exposes one tool, query_cto_knowledge, which the
# agent must consult before every CTO function and cite (hermes/AGENTS.md rule #1).
# It appears to the agent as `mcp_cto_knowledge_query_cto_knowledge`.
#
# linear (Phase 3) is the Linear integration over MCP-OAuth 2.1, used by the
# CTO-Architecture auditor to file [Brownfield] tech-debt tickets. Bind + authorize
# (one-time browser approval) with:
#   hermes mcp install linear        # OAuth device-code -> ~/.hermes/mcp-tokens/linear.json
#   hermes mcp test linear           # ✓ Connected
# NOTE (v0.17.0): this Linear MCP server exposes `save_issue` / `list_issues`
# (Linear normalizes GraphQL `teamId`/`labelIds` to `team`/`labels`). A one-shot
# `-z` session loads cto_knowledge but NOT linear unless the profile has the cached
# OAuth token — each profile has its own ~/.hermes[/profiles/<name>]/mcp-tokens/.
# For a non-default auditor profile, copy linear*.json into that profile's
# mcp-tokens/ (same Linear account, already-approved token).
#
# Apply cto_knowledge to the LIVE config from a clean clone with:
#   hermes mcp add cto_knowledge --url http://localhost:8080/mcp
#   hermes mcp configure cto_knowledge      # include: query_cto_knowledge
# (or copy this block into ~/.hermes/config.yaml and run `hermes mcp list` to confirm).
#
# codegen (Phase 4 P3) is the REMEDIATION back-end the tech-debt loop routes to —
# Codegen's agentic multi-file SWE backend over Streamable HTTP MCP. After the
# fused DETECT (SonarQube) + KEEP (graphify) signal is curated into a [Brownfield]
# ticket, Codegen is the named back-end for novel, judgment-heavy refactors
# (the recipe-amenable, mechanical alternative is Moderne/OpenRewrite — see below).
# Registered per the mcp_servers contract; the API key lives ONLY in ~/.hermes/.env
# as CODEGEN_API_KEY (gitleaks-enforced — never in this file). Bind with:
#   hermes mcp add codegen --url https://mcp.codegen.com/mcp
#   hermes mcp configure codegen      # auto-discovers Codegen's tools
# NOTE: Codegen is NAMED-ONLY in the loop here — the ticket routes to it and the
# config registers it, but no live Codegen agent run is triggered automatically
# (the free-tier runs are reserved for an optional demo). Naming the remediation
# back-end is the architectural decision; the live call is opt-in.
#
# Moderne/OpenRewrite (alternative remediation back-end, NOT registered here):
# OpenRewrite is the OSS deterministic recipe engine (Lossless Semantic Trees +
# composable Visitor recipes, format-preserving) — ideal for recipe-amenable,
# mechanical debt. Moderne ships a LOCAL MCP server installed with:
#   mod config agent-tools install        # exposes trigrep_search, find_types,
#                                          # change_type, search_recipes, run_recipe…
# Moderne has NO free tier, so it is documented as the recipe-amenable alternative
# and "evaluate Moderne (paid)" is rolled into GLO-14; the live named back-end for
# this stack is Codegen above.
mcp_servers:
  cto_knowledge:
    url: "http://localhost:8080/mcp"
    tools:
      include: [query_cto_knowledge]
    timeout: 60
  linear:
    url: "https://mcp.linear.app/mcp"
    auth: oauth
  codegen:
    url: "https://mcp.codegen.com/mcp"
    auth: oauth                            # token at ~/.hermes/mcp-tokens/codegen.json;
                                           # CODEGEN_API_KEY in ~/.hermes/.env (never here)
    timeout: 120
  # moderne (DEFERRED — NOT registered; GLO-14 Phase 7 / design Q11).
  # Moderne/OpenRewrite is the recipe-amenable remediation alternative to Codegen, but no
  # Moderne account is provisioned, so it stays a COMMENTED stub (not a live entry) — Codegen
  # remains the named-only back-end. To enable it in a future epic, install the Moderne LOCAL
  # MCP server, which registers it on stdio, then UNCOMMENT the block below:
  #   mod config agent-tools install       # exposes trigrep_search, find_types, change_type,
  #                                         # search_recipes, run_recipe, … on a local MCP server
  # moderne:
  #   command: "mod"                       # the Moderne CLI's local MCP server (stdio transport)
  #   args: ["mcp"]                        # `mod config agent-tools install` writes the real args
  #   # No url/auth: it is a LOCAL server (no egress). Pilot one recipe, then record the
  #   # route-to-Moderne decision vs Codegen in docs/system-design-tradeoffs.md.
