# Sovereign CTO Stack — compose skeleton.
#
# Phase 0: service stubs declared but NOT yet wired. Each service is fleshed
# out in a later phase (see comments). This file must pass `docker compose config -q`.
#
#   mem0-postgres  -> Phase 1 (Postgres + pgvector for self-hosted mem0)
#   rag-sidecar    -> Phase 2 (local Vector MCP serving query_cto_knowledge)
#   recorder       -> Phase 4 (Xvfb + ffmpeg x11grab -> recordings/*.mp4)
#
# mem0 itself runs as the SDK on the host against mem0-postgres (review decision:
# the full mem0 OSS server + Next.js dashboard is deferred to the Phase 5 full-build ticket).

services:
  # --- Phase 1: persistent memory backend for mem0 (SDK-on-host) ---
  mem0-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mem0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mem0}
      POSTGRES_DB: ${POSTGRES_DB:-vector_store}
    # Host port is configurable to avoid colliding with a host-native Postgres
    # already bound to 5432 (common on dev machines). Default published port is
    # 5433; override with MEM0_PG_HOST_PORT in .env if needed. Container stays 5432.
    ports:
      - "${MEM0_PG_HOST_PORT:-5433}:5432"
    volumes:
      - mem0-data:/var/lib/postgresql/data
      # Auto-create the pgvector extension on first init (clean-clone friendly).
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/00-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mem0} -d ${POSTGRES_DB:-vector_store}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Phase 2: local Vector RAG MCP sidecar (query_cto_knowledge) ---
  # Local Vector MCP: MiniLM embeddings + embedded LanceDB + FastMCP HTTP. On boot
  # it ingests the mounted corpus into the rag-index volume, then serves the
  # query_cto_knowledge tool at http://localhost:8080/mcp (bound to Hermes in
  # hermes/config.yaml). No external key — the embedding model is baked into the image.
  rag-sidecar:
    build:
      context: ./rag
    ports:
      - "${RAG_HOST_PORT:-8080}:8080"
    volumes:
      - ./corpus:/corpus:ro          # converted textbooks (gitignored, host-local)
      - rag-index:/data              # persisted LanceDB index
    environment:
      CORPUS_DIR: /corpus
      RAG_DB_DIR: /data
      RAG_PORT: "8080"
    healthcheck:
      # /health returns 200 once the server is up (reports chunk/source counts).
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    profiles: ["rag"]

  # --- Phase 4: Xvfb + ffmpeg recorder sidecar (-> recordings/*.mp4) ---
  # Bundles Xvfb (virtual X display :99) + ffmpeg (x11grab) + a minimal WM and
  # browser. Runs `idle` to keep the display up and HEALTHY; scripts/record_run.sh
  # drives capture via `docker exec` (paint a visible surface -> start -> stop with
  # graceful q to finalize the moov atom). Because x11grab records PIXELS, a visible
  # surface (service-graph.html / Linear / the PMF browser) must be painted onto :99
  # before capture (review decision) — record_run.sh guards with a non-blank check.
  #
  # recordings/ and graphify-out/ are HOST bind-mounts (not named volumes) so the
  # host (ffprobe, the non-blank frame check, the browser surface source) can read
  # the .mp4 and the service-graph.html directly. Both are gitignored.
  recorder:
    build:
      context: ./recorder
    environment:
      DISPLAY: ":99"
      SCREEN_W: "1280"
      SCREEN_H: "720"
      SCREEN_D: "24"
      REC_DIR: /recordings
    volumes:
      - ./recordings:/recordings          # host-readable .mp4 output (gitignored)
      - ./graphify-out:/graphify-out:ro   # the legible service-graph.html surface
    # Larger /dev/shm so chromium renders the surface without crashing.
    shm_size: "512m"
    restart: unless-stopped
    profiles: ["record"]

  # --- Phase 2 (P1): deny-by-default egress ---
  # There is intentionally NO egress service here. Egress enforcement is performed
  # OUT-OF-PROCESS by a real NVIDIA OpenShell sandbox, not by a compose sidecar:
  # workloads are confined with
  #
  #   openshell sandbox create --no-keep --policy egress/policy.yaml --from egress/ -- <cmd>
  #
  # The sandbox supervisor (PID 1) auto-injects HTTPS_PROXY and routes every
  # outbound TLS CONNECT through the OpenShell gateway's OPA proxy
  # (https://127.0.0.1:17670, a local launchd service). A CONNECT whose host:port
  # matches an `enforcement: enforce` endpoint in egress/policy.yaml (the reviewable
  # safety artifact) is tunnelled; any other CONNECT is REFUSED by default
  # (`curl: (56) CONNECT tunnel failed, response 403`). This OPA CONNECT network
  # layer is independent of the Landlock filesystem layer, so the deny-by-default
  # guarantee holds even where Landlock `best_effort` degrades on macOS
  # (docs/system-design-tradeoffs.md). The gate scripts/assert_egress_policy.py
  # drives a real sandbox and asserts the load-bearing NEGATIVE test (non-allow-
  # listed CONNECT refused) plus a positive-path check (api.linear.app:443 succeeds).

  # --- Phase 4 (P3): SonarQube Community — code-quality DETECT signal ---
  # The tech-debt loop's quality signal. SonarQube Community Edition runs an
  # embedded H2 database (single-node, fine for this scan target) and serves the
  # Web API at http://localhost:9000. Profile-gated ("sonar") so the default
  # `docker compose up` is unaffected; bring it up explicitly for the audit:
  #
  #   docker compose --profile sonar up -d sonarqube
  #   # wait for http://localhost:9000/api/system/status -> {"status":"UP"}
  #   # force a token (admin/admin first login), then scan the cloned demo source
  #   # (workspaces/microservices-demo/, gitignored) with sonar-scanner, and pull
  #   # issues/measures via scripts/sonarqube_client.py.
  #
  # SonarQube is the DETECT source; graphify is KEPT for cross-service coupling
  # (SonarQube has no coupling metric). scripts/fuse_signals.py merges SonarQube
  # issues/measures onto graphify-out/service-coupling.json under an additive
  # top-level `static_analysis` key (research §7 — the JSON is unvalidated).
  #
  # No secret is committed: the admin token minted on first login is persisted to
  # the gitignored .sonar-token (and/or ~/.hermes); scripts/sonarqube_client.py
  # reads $SONAR_TOKEN or that file. There is NO graceful degradation — if
  # SonarQube is unreachable the client/gate FAIL loudly (never fabricate issues).
  sonarqube:
    # Pinned (not the floating :community tag) so a new Community release can't be
    # pulled mid-stream and break the existing online-boutique scan project (H2
    # schema migrations / changed API responses). Matches the scanned version.
    image: sonarqube:26.6.0.123539-community
    ports:
      - "${SONAR_HOST_PORT:-9000}:9000"
    environment:
      # Single-node embedded H2 is acceptable for this one-shot scan target; skip
      # the production Elasticsearch bootstrap checks that assume a tuned host.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    healthcheck:
      # /api/system/status returns {"status":"UP"} once the web server is ready.
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped
    profiles: ["sonar"]

volumes:
  mem0-data:
  rag-index:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
